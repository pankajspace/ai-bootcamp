# Production RAG app (Module 13) - Shivank Agrawal / Future with Shivank
#
#   docker compose up -d db redis          # only the databases (run API + worker yourself)
#   docker compose --profile app up --build  # everything: db + redis + api + worker
#
# API docs: http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg17          # Postgres 17 with the pgvector extension (0.8.x)
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    profiles: ["app"]
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false   # works even before you create .env (Compose 2.24+)
    environment: &app_env
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
      BLOB_DIR: /data/blobs
      HF_HOME: /data/hf-cache
      FASTEMBED_CACHE_PATH: /data/fastembed-cache
    ports: ["8000:8000"]
    volumes: [appdata:/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    profiles: ["app"]
    build: .
    command: rq worker ingest --with-scheduler --worker-class rq.worker.SimpleWorker --url redis://redis:6379/0
    env_file:
      - path: .env
        required: false   # works even before you create .env (Compose 2.24+)
    environment: *app_env
    volumes: [appdata:/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  appdata:
